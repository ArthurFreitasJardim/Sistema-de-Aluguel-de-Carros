<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contratos | Locação Premium</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>

<div class="header">
    <a class="logo" href="/pedidos/">AluguelCar</a>

    <div class="nav">
        <!-- Menu do Cliente -->
        <span th:if="${perfil == 'CLIENTE'}" class="profile-wrapper">
            <button class="profile-button" th:text="${#strings.substring(usuarioNome,0,1)}">C</button>
            <div class="dropdown">
                <a href="/pedidos/lista">Meus pedidos</a>
                <a href="/contratos/lista">Contratos vigentes</a>
                <a href="/conta/dados">Dados da conta</a>
                <a href="/sair" onclick="setTimeout(() => location.reload(), 200)">Sair</a>
            </div>
        </span>

        <!-- Menu do Agente/Admin -->
        <span th:if="${perfil == 'ADMIN'}" class="profile-wrapper">
            <button class="profile-button">A</button>
            <div class="dropdown">
                <a href="/agente/pedidos">Gestão de Pedidos</a>
                <a href="/contratos/lista">Gestão de Contratos</a>
                <a href="/sair" onclick="setTimeout(() => location.reload(), 200)">Sair</a>
            </div>
        </span>
    </div>
</div>

<div class="container">
    <div class="hero" style="padding: 40px 0 30px; text-align: left;">
        <h1>Gestão de Contratos</h1>
        <p>Visualize os contratos gerados e o status das análises financeiras.</p>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Pedido</th>
                    <th>Cliente</th>
                    <th>CPF</th>
                    <th>Veículo</th>
                    <th>Placa</th>
                    <th>Início</th>
                    <th>Fim</th>
                    <th>Crédito</th>
                    <th>Banco Agente</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="contrato : ${contratos}">
                    <td th:text="'#' + ${contrato.id}" style="font-weight: 700; color: #111827;"></td>
                    <td th:text="'#' + ${contrato.pedidoId}"></td>
                    <td th:text="${contrato.clienteNome}" style="font-weight: 500; color: #111827;"></td>
                    <td th:text="${contrato.clienteCpf}"></td>
                    <td th:text="${contrato.carro}"></td>
                    <td th:text="${contrato.placa}"></td>
                    <td th:text="${contrato.dataInicio}"></td>
                    <td th:text="${contrato.dataFim}"></td>
                    
                    <!-- Feedback visual de crédito melhorado (Sim/Não virou Badge) -->
                    <td>
                        <span th:if="${contrato.possuiCredito}" class="badge badge-success">Aprovado</span>
                        <span th:unless="${contrato.possuiCredito}" class="badge badge-danger">Reprovado</span>
                    </td>
                    
                    <td th:text="${contrato.bancoAgente != null ? contrato.bancoAgente : '-'}"></td>
                    
                    <!-- Status do Contrato centralizado visualmente -->
                    <td>
                        <span class="badge badge-neutral" th:text="${contrato.statusContrato}"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
