<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Pedido</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            margin: 0;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px 40px;
        }

        .container {
            width: 520px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="header">
    <h2>🚗 Sistema de Aluguel de Carros</h2>
    <p>👤 Visão do Cliente | Editar Pedido</p>
</div>

<div class="container">
    <h2>Editar Pedido</h2>

    <form action="/pedidos/atualizar" method="post">
        <input type="hidden" name="id" th:value="${pedido.get().id}">

        <label>Cliente</label>
        <input type="text" name="clienteNome" th:value="${pedido.get().clienteNome}" required>

        <label>Marca</label>
        <select id="marca" required></select>

        <label>Modelo</label>
        <select id="modelo" required></select>

        <input type="hidden" name="carro" id="carroCompleto">

        <label>Dias</label>
        <input type="number" name="dias" min="1" th:value="${pedido.get().dias}" required>

        <button type="submit">Salvar Alterações</button>
    </form>
</div>

<script th:inline="javascript">
    const carroAtual = /*[[${pedido.get().carro}]]*/ "";
</script>

<script>
    const marcaSelect = document.getElementById("marca");
    const modeloSelect = document.getElementById("modelo");
    const hiddenCarro = document.getElementById("carroCompleto");
    const form = document.querySelector("form");

    let marcaAtual = "";
    let modeloAtual = "";

    if (carroAtual.includes(" - ")) {
        const partes = carroAtual.split(" - ");
        marcaAtual = partes[0];
        modeloAtual = partes[1];
    }

    async function carregarMarcas() {
        const response = await fetch("https://parallelum.com.br/fipe/api/v1/carros/marcas");
        const marcas = await response.json();

        marcaSelect.innerHTML = '<option value="">Selecione a marca</option>';

        for (const marca of marcas) {
            const selected = marca.nome === marcaAtual ? "selected" : "";
            marcaSelect.innerHTML +=
                `<option value="${marca.codigo}" ${selected}>${marca.nome}</option>`;
        }

        const marcaSelecionada = marcas.find(m => m.nome === marcaAtual);

        if (marcaSelecionada) {
            await carregarModelos(marcaSelecionada.codigo);
        }
    }

    async function carregarModelos(marcaId) {
        const response = await fetch(
            `https://parallelum.com.br/fipe/api/v1/carros/marcas/${marcaId}/modelos`
        );

        const data = await response.json();

        modeloSelect.innerHTML = '<option value="">Selecione um modelo</option>';

        data.modelos.forEach(modelo => {
            const selected = modelo.nome === modeloAtual ? "selected" : "";
            modeloSelect.innerHTML +=
                `<option value="${modelo.nome}" ${selected}>${modelo.nome}</option>`;
        });
    }

    marcaSelect.addEventListener("change", function () {
        if (this.value) {
            carregarModelos(this.value);
        }
    });

    form.addEventListener("submit", function () {
        const marcaNome = marcaSelect.options[marcaSelect.selectedIndex].text;
        const modeloNome = modeloSelect.value;
        hiddenCarro.value = marcaNome + " - " + modeloNome;
    });

    carregarMarcas();
</script>

</body>
</html>
