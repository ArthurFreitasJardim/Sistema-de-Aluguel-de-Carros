<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pedido | Locação Premium</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>

<div class="header">
    <a class="logo" href="/pedidos/">AluguelCar</a>
    
    <div class="nav">
        <!-- Navegação focada para a tela de edição -->
        <a class="btn btn-secondary btn-sm" href="/pedidos/lista">Voltar aos pedidos</a>
        <a class="btn btn-primary btn-sm" style="background: #ef4444;" href="/sair" onclick="setTimeout(() => location.reload(), 200)">Sair</a>
    </div>
</div>

<div class="container">
    <div class="form-box">
        <div class="form-header">
            <h1>Editar Reserva</h1>
            <p>Ajuste a quantidade de dias para sua locação.</p>
        </div>

        <form action="/pedidos/atualizar" method="post">
            <input type="hidden" name="id" th:value="${pedido.get().id}">

            <div class="form-group">
                <label for="carro">Veículo Selecionado</label>
                <!-- Campo readonly ganha visual de bloqueado no CSS -->
                <input type="text" id="carro" name="carro" th:value="${pedido.get().carro}" readonly>
            </div>

            <div class="form-group">
                <label for="dias">Período de Locação (Dias)</label>
                <input type="number" id="dias" name="dias" min="1" th:value="${pedido.get().dias}" required>
            </div>

            <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 16px;">
                Salvar Alterações
            </button>
        </form>
    </div>
</div>

</body>
</html>
