<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | Locação Premium</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>

<div class="header">
    <a class="logo" href="/pedidos/">AluguelCar</a>

    <div class="nav">
        <span th:if="${perfil == 'VISITANTE'}" class="actions">
            <a class="btn btn-secondary" href="/login">Acessar</a>
            <a class="btn btn-primary" href="/cadastro">Criar Conta</a>
        </span>

        <span th:if="${perfil == 'CLIENTE'}" class="profile-wrapper">
            <button class="profile-button" th:text="${#strings.substring(usuarioNome,0,1)}">C</button>
            <div class="dropdown">
                <a href="/pedidos/lista">Meus pedidos</a>
                <a href="/contratos/lista">Contratos vigentes</a>
                <a href="/conta/dados">Dados da conta</a>
                <a href="/sair" onclick="setTimeout(() => location.reload(), 200)">Sair</a>
            </div>
        </span>

        <span th:if="${perfil == 'ADMIN'}" class="profile-wrapper">
            <button class="profile-button">A</button>
            <div class="dropdown">
                <a href="/agente/pedidos">Gestão de Pedidos</a>
                <a href="/contratos/lista">Gestão de Contratos</a>
                <a href="/sair" onclick="setTimeout(() => location.reload(), 200)">Sair</a>
            </div>
        </span>
    </div>
</div>

<div class="container">
    <div class="hero">
        <h1>Mobilidade premium, sem complicação.</h1>
        <p>Escolha o veículo ideal e solicite sua reserva instantaneamente.</p>
    </div>

    <input class="search" id="searchInput" placeholder="Buscar veículo por marca ou modelo..." onkeyup="filtrarCarros()">

    <div class="grid">
        <div class="card" th:each="carro : ${carros}" th:attr="data-search=${carro.marca + ' ' + carro.modelo}">
            
            <!-- A imagem agora é um link clicável para os detalhes -->
            <a th:href="@{/carros/detalhes/{id}(id=${carro.codigo})}" style="display: block; text-decoration: none;">
                <img class="car-img" th:src="${carro.imagemUrl}" alt="Imagem do veículo">
            </a>

            <div class="card-body">
                <!-- O título também leva aos detalhes -->
                <a th:href="@{/carros/detalhes/{id}(id=${carro.codigo})}" style="text-decoration: none; color: inherit;">
                    <h2 th:text="${carro.marca + ' ' + carro.modelo}"></h2>
                </a>
                
                <div class="muted" th:text="${carro.descricao}"></div>

                <!-- Mini-dashboard de especificações -->
                <div class="specs-grid">
                    <div class="spec-item">
                        <span>Ano</span>
                        <strong th:text="${carro.ano}"></strong>
                    </div>
                    <div class="spec-item">
                        <span>Quilometragem</span>
                        <strong th:text="${carro.km}"></strong>
                    </div>
                    <div class="spec-item">
                        <span>Matrícula</span>
                        <strong th:text="${carro.matricula}"></strong>
                    </div>
                    <div class="spec-item">
                        <span>Placa</span>
                        <strong th:text="${carro.placa}"></strong>
                    </div>
                </div>

                <div class="price">
                    R$ <span th:text="${#numbers.formatDecimal(carro.precoDiaria, 1, 2)}" style="font-size: 24px; color: #111827; font-weight: 800;"></span> <span>/ dia</span>
                </div>

                <!-- O formulário foi substituído por um botão elegante que direciona para a tela de detalhes -->
                <a class="btn btn-primary" th:href="@{/carros/detalhes/{id}(id=${carro.codigo})}" style="width: 100%; text-align: center; margin-top: auto;">
                    Ver Detalhes e Alugar
                </a>
            </div>
        </div>
    </div>
</div>

<script>
function filtrarCarros() {
    const termo = document.getElementById("searchInput").value.toLowerCase();
    document.querySelectorAll(".card").forEach(card => {
        const texto = card.getAttribute("data-search").toLowerCase();
        card.style.display = texto.includes(termo) ? "flex" : "none";
    });
}
</script>

</body>
</html>
