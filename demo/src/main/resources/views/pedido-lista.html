<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos | Locação Premium</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>

<div class="header">
    <a class="logo" href="/pedidos/">AluguelCar</a>

    <div class="nav">
        <!-- O Menu foi mantido focado apenas no cliente logado nesta visão -->
        <span class="profile-wrapper">
            <button class="profile-button" th:text="${#strings.substring(usuarioNome,0,1)}">C</button>
            <div class="dropdown">
                <a href="/pedidos/lista">Meus pedidos</a>
                <a href="/contratos/lista">Contratos vigentes</a>
                <a href="/conta/dados">Dados da conta</a>
                <a href="/sair" onclick="setTimeout(() => location.reload(), 200)">Sair</a>
            </div>
        </span>
    </div>
</div>

<div class="container">
    <div class="hero" style="padding: 40px 0 30px; text-align: left;">
        <h1>Meus Pedidos</h1>
        <p>Acompanhe o status e gerencie suas solicitações de locação.</p>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Ano</th>
                    <th>Placa</th>
                    <th>Dias</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pedido : ${pedidos}">
                    <td th:text="${pedido.id}"></td>
                    <td th:text="${pedido.marca}"></td>
                    <td th:text="${pedido.modelo}" style="font-weight: 600; color: #111827;"></td>
                    <td th:text="${pedido.ano}"></td>
                    <td th:text="${pedido.placa}"></td>
                    <td th:text="${pedido.dias}"></td>

                    <!-- Status com Badges (Pills) -->
                    <td>
                        <span th:if="${pedido.status.name() == 'CANCELADO'}" class="badge badge-danger">CANCELADO</span>
                        <span th:if="${pedido.status.name() == 'CONTRATO_GERADO'}" class="badge badge-success">CONTRATO ATIVO</span>
                        <span th:if="${pedido.status.name() != 'CANCELADO' and pedido.status.name() != 'CONTRATO_GERADO'}" 
                              class="badge badge-neutral" 
                              th:text="${pedido.status}">
                        </span>
                    </td>

                    <!-- Ações -->
                    <td>
                        <div class="actions" 
                             th:if="${pedido.status.name() != 'CANCELADO' 
                                  and pedido.status.name() != 'APROVADO' 
                                  and pedido.status.name() != 'CONTRATO_GERADO'}">

                            <a class="btn btn-secondary btn-sm" th:href="@{/pedidos/editar/{id}(id=${pedido.id})}">
                                Editar
                            </a>

                            <form action="/pedidos/cancelar" method="post" style="margin: 0;">
                                <input type="hidden" name="id" th:value="${pedido.id}">
                                <button class="btn btn-danger btn-sm" 
                                        onclick="return confirm('Tem certeza que deseja cancelar esta reserva?')">
                                    Cancelar
                                </button>
                            </form>
                        </div>

                        <!-- Textos de Feedback -->
                        <span th:if="${pedido.status.name() == 'CANCELADO'}" class="text-muted-sm">
                            Encerrado
                        </span>

                        <span th:if="${pedido.status.name() == 'APROVADO'}" class="text-muted-sm">
                            Aprovado (Aguardando)
                        </span>

                        <span th:if="${pedido.status.name() == 'CONTRATO_GERADO'}" class="text-muted-sm" style="color: #10b981; font-weight: 600;">
                            Em vigor
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
